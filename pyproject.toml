[build-system]
requires = [ 'setuptools >= 69.0' ]
build-backend = 'setuptools.build_meta'

[project]
name = 'bsmu.macula'
dynamic = [ 'version' ]
description = 'This application analyzes OCT images to detect and monitor Age-Related Macular Degeneration'
readme = 'README.md'
requires-python = '>= 3.11'
license = { file = 'LICENSE' }
authors = [
    { name = 'Elena Himbitskaya', email = 'fpm.gimbicka@bsu.by' },
]
keywords = [
    'age-related macular degeneration',
    'amd',
    'optical coherence tomography',
    'oct',
    'image analysis',
]
classifiers = [
    'Development Status :: 3 - Alpha',
    'Intended Audience :: Science/Research',
    'Intended Audience :: Healthcare Industry',
    'License :: OSI Approved :: BSD License',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Operating System :: OS Independent',
    'Topic :: Software Development :: Version Control :: Git',
]
dependencies = [
    'bsmu.vision[common,pdf,nn_inference,build] @ git+https://github.com/BSMU-ITLab/vision.git@v0.54.0',
]

[project.urls]
Homepage = 'https://github.com/BSMU-ITLab/vision-macula'
Repository = 'https://github.com/BSMU-ITLab/vision-macula.git'
Issues = 'https://github.com/BSMU-ITLab/vision-macula/issues'

[project.scripts]
bsmu-macula-c = 'bsmu.macula.app.main:run_app'

[project.gui-scripts]
bsmu-macula = 'bsmu.macula.app.main:run_app'

[tool.setuptools.dynamic]
version = { attr = 'bsmu.macula.__version__' }

[tool.setuptools.packages.find]
where = [ 'src' ]

[tool.setuptools.package-data]
'*' = [ '**/*.conf.yaml' ]

[tool.ruff]
line-length = 120
extend-exclude = [
    'temp',
    '*_rc.py',  # E.g. icons_rc.py
]

[tool.ruff.lint]
future-annotations = true
select = [
    'E',    # pycodestyle errors
    'W',    # pycodestyle warnings
    'F',    # Pyflakes
    'I',    # isort
    'UP',   # pyupgrade
    'B',    # flake8-bugbear
    'SIM',  # flake8-simplify
    'C4',   # flake8-comprehensions
    'TC',   # flake8-type-checking
]
ignore = [
    'E501',  # Line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
'__init__.py' = ['F401']  # Allow unused imports for re-exports

[tool.ruff.lint.isort]
section-order = [
    'future',
    'standard-library',
    'third-party',
    'bsmu-framework',
    'first-party',
    'local-folder',
]

[tool.ruff.lint.isort.sections]
'bsmu-framework' = ['bsmu.vision']

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    'PySide6.QtCore.QModelIndex',
]

[tool.ruff.format]
quote-style = 'single'
